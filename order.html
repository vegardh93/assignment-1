<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order | RØDE NT1 5th Generation</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/order.css">
</head>
<body>
    <!-- Order page -->
    <main>
        <section class="order">
            <div class="container">
                <h1 class="order__title">Order Your Røde NT1</h1>
                <p class="order__description">
                    Configure your RØDE NT1 5th Generation microphone and enter your order details below.
                </p>
                <!-- Order form -->
                <form class="order__form">
                    <!-- Microphone color selection -->
                    <fieldset class="order__colors">
                        <legend>Choose a color</legend>
                        <div class="order__colorOptions">
                            <input type="radio" id="orderColorBlack" name="orderColor" value="black" checked>
                            <label for="orderColorBlack">Black</label>
                            <input type="radio" id="orderColorSilver" name="orderColor" value="silver">
                            <label for="orderColorSilver">Silver</label>
                        </div>
                    </fieldset>
                    <!-- Product quantity -->
                    <div class="order__quantity">
                        <label for="orderQuantity">Quantity</label>
                        <input type="number" id="orderQuantity" name="orderQuantity" min="1" value="1" required>
                    </div>
                    <!-- Customer information -->
                    <fieldset class="order__customerInformation">
                        <legend>Customer Information</legend>
                        <!-- Full name -->
                        <div class="order__field">
                            <label for="customerFullName">Full name</label>
                            <input type="text" id="customerFullName" name="fullName" autocomplete="name" required>
                        </div>
                        <!-- Email address -->
                        <div class="order__field">
                            <label for="customerEmail">Email address</label>
                            <input type="email" id="customerEmail" name="email" autocomplete="email" required>
                        </div>
                        <!-- Phone number -->
                        <div class="order__field">
                            <label for="customerPhone">Phone number</label>
                            <input type="tel" id="customerPhone" name="phone" autocomplete="tel">
                        </div>
                    </fieldset>
                    <!-- Shipping information -->
                    <fieldset class="order__shippingInformation">
                        <legend>Shipping Information</legend>
                        <!-- Street address -->
                        <div class="order__field">
                            <label for="shippingStreetAddress">Street address</label>
                            <input type="text" id="shippingStreetAddress" name="streetAddress" name="streetAddress" required>
                        </div>
                        <!-- City -->
                        <div class="order__field">
                            <label for="shippingCity">City</label>
                            <input type="text" id="shippingCity" name="city" autocomplete="address-level2" required>
                        </div>
                        <!-- Country -->
                        <div class="order__field">
                            <label for="shippingCountry">Country</label>
                            <input type="text" id="shippingCountry" name="country" autocomplete="country-name" required>
                        </div>
                    </fieldset>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
